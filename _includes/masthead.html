{% include base_path %}
<header class="masthead">
  <div class="masthead__inner-wrap">
    <nav class="primary-nav" aria-label="Main navigation">
      <a class="site-title" href="{{ base_path }}/"{% if page.url == '/' %} aria-current="page"{% endif %}>{{ site.title }}</a>
      <ul class="primary-nav__links">
        {% for link in site.data.navigation.main %}
          {% assign domain = base_path %}
          {% if link.url contains 'http' %}{% assign domain = '' %}{% endif %}
          <li><a href="{{ domain }}{{ link.url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a></li>
        {% endfor %}
      </ul>
     <!-- <button class="theme-toggle" type="button" aria-pressed="false" hidden>Dark mode</button> -->
    </nav>
  </div>
</header>
